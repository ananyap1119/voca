[package]
name = "voca"
version = "0.2.0"
description = "Tray-app dictation for 22 Indian languages"
authors = ["Sovereign Shovels"]
license = "Apache-2.0"
repository = "https://github.com/ananyap1119/voca"
edition = "2021"
rust-version = "1.75"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-positioner = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "multipart", "rustls-tls-native-roots", "system-proxy"] }
futures-util = "0.3"
cpal = "0.15"
hound = "3.5"
tokio-tungstenite = { version = "0.24", features = ["native-tls"] }
enigo = "0.2"
async-trait = "0.1"
toml = "0.8"
windows = { version = "0.61.3", features = ["Win32_Foundation", "Win32_Security_Credentials", "Win32_UI_WindowsAndMessaging"] }

[features]
custom-protocol = ["tauri/custom-protocol"]
