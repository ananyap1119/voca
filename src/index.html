<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>voca</title>
  <style>
    :root {
      --bg: #0f172a;
      --surface: #1e293b;
      --text: #e2e8f0;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --border: #334155;
      --success: #22c55e;
      --danger: #ef4444;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      padding: 24px;
    }
    h1 { font-size: 1.25rem; margin-bottom: 4px; }
    .subtitle { color: var(--muted); font-size: 0.875rem; margin-bottom: 24px; }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 16px;
    }
    .card h2 {
      font-size: 0.875rem;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 12px;
      letter-spacing: 0.05em;
    }
    label {
      display: block;
      margin-bottom: 12px;
      font-size: 0.875rem;
    }
    label span {
      display: block;
      color: var(--muted);
      margin-bottom: 4px;
    }
    input, select {
      width: 100%;
      padding: 8px 12px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font-size: 0.875rem;
    }
    input:focus, select:focus {
      outline: none;
      border-color: var(--accent);
    }
    .row {
      display: flex;
      gap: 12px;
    }
    .row > * { flex: 1; }
    .toggle {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
    }
    .toggle input { width: auto; }
    .status {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 12px;
      background: var(--bg);
      border-radius: 6px;
      font-size: 0.875rem;
    }
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--muted);
    }
    .status-dot.recording { background: var(--danger); animation: pulse 1s infinite; }
    .status-dot.ready { background: var(--success); }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }
    .hotkey {
      font-family: ui-monospace, monospace;
      background: var(--bg);
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 0.8rem;
      border: 1px solid var(--border);
    }
    footer {
      margin-top: 24px;
      text-align: center;
      color: var(--muted);
      font-size: 0.75rem;
    }
    footer a { color: var(--accent); text-decoration: none; }
  </style>
</head>
<body>
  <h1>voca</h1>
  <p class="subtitle">Tray dictation for 22 Indian languages</p>

  <div class="card">
    <h2>Status</h2>
    <div class="status">
      <div class="status-dot ready" id="status-dot"></div>
      <span id="status-text">Ready — press <span class="hotkey" id="hotkey-display">Ctrl+Alt+Shift+S</span> to dictate</span>
    </div>
    <p id="hotkey-status" style="margin-top: 8px; color: var(--muted); font-size: 0.8rem;"></p>
    <button id="test-mic" style="margin-top: 12px; padding: 8px 12px; border-radius: 6px; border: 1px solid var(--border); background: var(--bg); color: var(--text); cursor: pointer;">Test mic</button>
    <button id="dictate-now" style="margin-top: 8px; padding: 8px 12px; border-radius: 6px; border: 1px solid var(--border); background: var(--bg); color: var(--text); cursor: pointer;">Dictate now</button>
    <button id="stop-recording" style="margin-top: 8px; padding: 8px 12px; border-radius: 6px; border: 1px solid var(--border); background: var(--bg); color: var(--text); cursor: pointer;">Stop</button>
    <button id="reset-recording" style="margin-top: 8px; padding: 8px 12px; border-radius: 6px; border: 1px solid var(--border); background: var(--bg); color: var(--text); cursor: pointer;">Reset</button>
    <div style="margin-top: 12px; height: 10px; border: 1px solid var(--border); border-radius: 999px; overflow: hidden; background: var(--bg);">
      <div id="mic-level" style="width: 0%; height: 100%; background: var(--accent); transition: width 80ms linear;"></div>
    </div>
    <p id="mic-status" style="margin-top: 8px; color: var(--muted); font-size: 0.8rem;"></p>
    <textarea id="transcript" readonly style="margin-top: 12px; width: 100%; min-height: 96px; resize: vertical; padding: 8px 12px; border-radius: 6px; border: 1px solid var(--border); background: var(--bg); color: var(--text); font-size: 0.875rem;"></textarea>
    <button id="copy-transcript" style="margin-top: 8px; padding: 8px 12px; border-radius: 6px; border: 1px solid var(--border); background: var(--bg); color: var(--text); cursor: pointer;">Copy text</button>
  </div>

  <div class="card">
    <h2>Language</h2>
    <label>
      <span>Primary language</span>
      <select id="language">
        <option value="unknown">Auto detect</option>
        <option value="hi-IN">Hindi (hi-IN)</option>
        <option value="as-IN">Assamese (as-IN)</option>
        <option value="bn-IN">Bengali (bn-IN)</option>
        <option value="brx-IN">Bodo (brx-IN)</option>
        <option value="doi-IN">Dogri (doi-IN)</option>
        <option value="en-IN">English (en-IN)</option>
        <option value="gu-IN">Gujarati (gu-IN)</option>
        <option value="kn-IN">Kannada (kn-IN)</option>
        <option value="kok-IN">Konkani (kok-IN)</option>
        <option value="ks-IN">Kashmiri (ks-IN)</option>
        <option value="mai-IN">Maithili (mai-IN)</option>
        <option value="ml-IN">Malayalam (ml-IN)</option>
        <option value="mni-IN">Manipuri (mni-IN)</option>
        <option value="mr-IN">Marathi (mr-IN)</option>
        <option value="ne-IN">Nepali (ne-IN)</option>
        <option value="od-IN">Odia (od-IN)</option>
        <option value="pa-IN">Punjabi (pa-IN)</option>
        <option value="sa-IN">Sanskrit (sa-IN)</option>
        <option value="sat-IN">Santali (sat-IN)</option>
        <option value="sd-IN">Sindhi (sd-IN)</option>
        <option value="ta-IN">Tamil (ta-IN)</option>
        <option value="te-IN">Telugu (te-IN)</option>
        <option value="ur-IN">Urdu (ur-IN)</option>
      </select>
    </label>
    <label class="toggle">
      <input type="checkbox" id="codemix" checked />
      <span>Enable codemix mode (Hinglish / Tanglish)</span>
    </label>
  </div>

  <div class="card">
    <h2>Provider</h2>
    <label>
      <span>STT Provider</span>
      <select id="provider">
        <option value="saaras">Saaras v3 (cloud)</option>
      </select>
    </label>
    <label>
      <span>Your Sarvam API key</span>
      <input type="password" id="api-key" placeholder="Paste your API key" autocomplete="off" />
    </label>
    <button id="save-api-key" style="padding: 8px 12px; border-radius: 6px; border: 1px solid var(--border); background: var(--bg); color: var(--text); cursor: pointer;">Save key</button>
    <button id="remove-api-key" style="padding: 8px 12px; border-radius: 6px; border: 1px solid var(--border); background: var(--bg); color: var(--text); cursor: pointer;">Remove key</button>
    <p id="api-key-status" style="margin-top: 8px; color: var(--muted); font-size: 0.8rem;">Checking saved key...</p>
  </div>

  <div class="card">
    <h2>Polish</h2>
    <label>
      <span>Grammar and punctuation</span>
      <select id="polish-mode">
        <option value="light">Light local cleanup</option>
        <option value="full">Full grammar polish</option>
        <option value="off">Off</option>
      </select>
    </label>
    <label>
      <span>Full polish endpoint</span>
      <input type="text" id="polish-endpoint" placeholder="OpenAI-compatible /v1/chat/completions URL" />
    </label>
    <label>
      <span>Full polish model</span>
      <input type="text" id="polish-model" placeholder="Model name for the configured endpoint" />
    </label>
    <label>
      <span>Full polish API key env var or pasted key</span>
      <input type="text" id="polish-api-key-env" placeholder="Optional" />
    </label>
  </div>

  <div class="card">
    <h2>Config</h2>
    <p style="font-size: 0.875rem; color: var(--muted);">
      Edit <code style="background: var(--bg); padding: 2px 6px; border-radius: 4px;" id="config-path">...</code> for advanced settings.
    </p>
  </div>

  <footer>
    <a href="https://github.com/sovereign-shovels/voca">GitHub</a> ·
    Part of <a href="https://github.com/sovereign-shovels">sovereign-shovels</a>
  </footer>

  <script src="main.js"></script>
</body>
</html>
